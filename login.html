<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title>Admin Login | Galaxy Digital Advertisers</title>

<style>
:root {
  --bg: #080b14;
  --panel: #101827;
  --cyan: #32d9f5;
  --purple: #9565ff;
  --white: #f4f7ff;
  --muted: #91a0b8;
  --border: rgba(91, 180, 220, .2);
  --red: #ff657a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: var(--white);
  background:
    radial-gradient(ellipse at 15% 15%, rgba(99, 75, 200, .18), transparent 40%),
    radial-gradient(ellipse at 90% 85%, rgba(0, 195, 230, .12), transparent 40%),
    var(--bg);
}

.login-container {
  width: 100%;
  max-width: 440px;
}

.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand-icon {
  color: var(--cyan);
  font-size: 38px;
  text-shadow: 0 0 20px rgba(50, 217, 245, .7);
}

.brand h1 {
  font-size: 24px;
  margin-top: 8px;
  letter-spacing: .3px;
}

.brand p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 7px;
}

.login-card {
  background: linear-gradient(145deg, #141e30, #0c1321);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 35px;
  box-shadow: 0 20px 65px rgba(0, 0, 0, .35);
  position: relative;
  overflow: hidden;
}

.login-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  width: 50%;
  height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  box-shadow: 0 0 15px var(--cyan);
}

.login-card h2 {
  font-size: 24px;
  margin-bottom: 7px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 27px;
}

.field {
  margin-bottom: 19px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
  color: #dce6f5;
}

input {
  width: 100%;
  padding: 13px 14px;
  background: #080f1d;
  border: 1px solid rgba(134, 166, 205, .22);
  border-radius: 7px;
  color: var(--white);
  font-size: 14px;
  outline: none;
  transition: .2s;
}

input::placeholder {
  color: #65758e;
}

input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(50, 217, 245, .1);
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 7px;
  background: linear-gradient(110deg, #20cde9, #648bff);
  color: #06111d;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: .25s;
  box-shadow: 0 0 18px rgba(50, 217, 245, .17);
}

button:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
  transform: none;
}

#loginError {
  color: var(--red);
  font-size: 13px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

#loginMessage {
  color: var(--cyan);
  font-size: 13px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #718099;
  font-size: 12px;
  margin-top: 23px;
}

@media(max-width: 480px) {
  .login-card {
    padding: 25px 21px;
  }

  .brand h1 {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="login-container">

  <div class="brand">
    <div class="brand-icon">✦</div>
    <h1>Galaxy Digital Advertisers</h1>
    <p>Secure Administrator Access</p>
  </div>

  <section class="login-card">

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to access your administrator dashboard.</p>

    <form id="loginForm">

      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="loginButton">
        Sign In
      </button>

      <p id="loginMessage" role="status"></p>
      <p id="loginError" role="alert"></p>

    </form>

  </section>

  <p class="footer">
    © <span id="year"></span> Galaxy Digital Advertisers. All rights reserved.
  </p>

</div>

<script type="module">
import { supabase } from "./supabase.js";

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginError = document.getElementById("loginError");
const loginMessage = document.getElementById("loginMessage");

document.getElementById("year").textContent =
  new Date().getFullYear();

/* VERIFY ADMINISTRATOR */

async function verifyAdmin(user) {
  const { data: admin, error } = await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    throw error;
  }

  if (!admin) {
    await supabase.auth.signOut();
    throw new Error("You are not authorized to access the administrator dashboard.");
  }

  return true;
}

/* CHECK EXISTING SESSION */

async function checkExistingSession() {
  try {
    const { data, error } = await supabase.auth.getSession();

    if (error) throw error;

    if (!data.session) return;

    await verifyAdmin(data.session.user);

    window.location.replace("admin.html");

  } catch (error) {
    loginError.textContent = error.message;
  }
}

/* LOGIN */

loginForm.addEventListener("submit", async event => {
  event.preventDefault();

  loginError.textContent = "";
  loginMessage.textContent = "";

  loginButton.disabled = true;
  loginButton.textContent = "Signing In...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await verifyAdmin(data.user);

    loginMessage.textContent = "Login successful. Redirecting...";

    window.location.replace("admin.html");

  } catch (error) {
    loginError.textContent = error.message;

    loginButton.disabled = false;
    loginButton.textContent = "Sign In";
  }
});

/* START */

await checkExistingSession();
</script>

</body>
</html>
